<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CoreFlow | Gestión Comercial</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Estilos propios -->
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>

<body>

<div class="container mt-4">

    <!-- 🔹 NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-light bg-white mb-4 shadow-sm rounded">

    <div class="container-fluid">

        <!-- Marca -->
        <a class="navbar-brand fw-bold text-primary" href="{{ url_for('index') }}">
            CoreFlow
        </a>

        <!-- Botón hamburguesa -->
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <!-- Menú -->
        <div class="collapse navbar-collapse" id="navbarNav">
            <div class="ms-auto d-flex flex-column flex-lg-row gap-2 mt-3 mt-lg-0">

                <a href="{{ url_for('index') }}" class="btn btn-light">👤 Clientes</a>
                <a href="{{ url_for('dashboard') }}" class="btn btn-light">📊 Dashboard</a>
                <a href="{{ url_for('nuevo_producto') }}" class="btn btn-light">📦 Productos</a>
                <a href="{{ url_for('nueva_venta') }}" class="btn btn-light">💰 Venta</a>
                <a href="{{ url_for('listar_ventas') }}" class="btn btn-light">📄 Ventas</a>

            </div>
        </div>

    </div>

</nav>
    <!-- 🔹 CONTENIDO DINÁMICO -->
    {% block content %}{% endblock %}

</div>

<!-- Bootstrap JS (opcional, pero recomendado) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
document.addEventListener("DOMContentLoaded", function () {
    const navLinks = document.querySelectorAll(".navbar-collapse a");
    const navbarCollapse = document.querySelector(".navbar-collapse");

    navLinks.forEach(function(link) {
        link.addEventListener("click", function () {
            const bsCollapse = new bootstrap.Collapse(navbarCollapse, {
                toggle: false
            });
            bsCollapse.hide();
        });
    });
});
</script>

</body>
</html>
