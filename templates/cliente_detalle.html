{% extends 'base.html' %}

{% block content %}

<h3>{{ cliente.nombre }}</h3>

<p><strong>Email:</strong> {{ cliente.email }}</p>
<p><strong>Teléfono:</strong> {{ cliente.telefono }}</p>

<p>
  <a href="{{ url_for('nueva_interaccion', id=cliente.id) }}" class="btn btn-sm btn-success">
    + Agregar interacción
  </a>
</p>

<h5>Interacciones</h5>

<div class="table-responsive">
    <table class="table table-striped">
        <tr>
            <th>Tipo</th>
            <th>Nota</th>
            <th>Fecha</th>
        </tr>

        {% for i in cliente.interacciones %}
        <tr>
            <td>{{ i.tipo }}</td>
            <td>{{ i.nota }}</td>
            <td>{{ i.fecha | fecha }}</td>
        </tr>
        {% endfor %}
    </table>
</div>

{% endblock %}
